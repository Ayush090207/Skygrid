[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skygrid"
version = "1.0.0"
description = "Urban Drone Delivery Swarm Trajectory Generator and Distributed Airspace Coordinator"
authors = [{ name = "SkyGrid Dynamics Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0"
]

[project.scripts]
skygrid = "cli:main"
